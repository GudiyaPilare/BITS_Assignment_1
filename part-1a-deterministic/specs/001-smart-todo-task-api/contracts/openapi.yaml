openapi: 3.0.3
info:
  title: Smart Todo and Task Management REST API
  version: "1.0.0"
paths:
  /tasks:
    get:
      summary: List tasks ordered by lexicographic UUID v4
      responses:
        "200":
          description: Task array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      summary: Retrieve a task
      responses:
        "200":
          description: Task found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update mutable task fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete a task
      responses:
        "204":
          description: Task deleted; no response body
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /tasks/{id}/status:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    patch:
      summary: Change task status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Canonical UUID v4 task identifier
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  responses:
    BadRequest:
      description: Malformed, unreadable, or invalid UTF-8 JSON; invalid field value; malformed ID; or empty update body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: HTTP 404. A correctly formatted unknown task ID uses NOT_FOUND; an unknown API route uses ROUTE_NOT_FOUND.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: Known route received an unsupported HTTP method
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContentTooLarge:
      description: Request body exceeds 64 KiB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: HTTP 415. Missing Content-Type or a non-application/json or unsupported Content-Type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server failure without internal detail
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CreateTask:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Required title. Trim outer whitespace before validation; the 1–200 character limit applies only after trimming, and the stored title has no outer whitespace.
        description:
          type: string
          maxLength: 2000
          description: Optional string. Null is rejected during task creation.
        priority:
          type: string
          enum: [Low, Medium, High]
          default: Medium
        dueDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Optional ISO YYYY-MM-DD date. Null is rejected during creation. The value must also be a real valid Gregorian calendar date.
          x-real-gregorian-date: true
    UpdateTask:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Supplied title is trimmed before the 1–200 character limit is validated and cannot be null.
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: Omit to leave unchanged; null clears the existing description.
        priority:
          type: string
          enum: [Low, Medium, High]
        dueDate:
          type: string
          nullable: true
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Omit to leave unchanged; null clears the existing due date. A string must be a real valid Gregorian calendar date in YYYY-MM-DD form.
          x-real-gregorian-date: true
    StatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [Pending, Completed]
    Task:
      type: object
      additionalProperties: false
      required: [id, title, description, priority, status, dueDate]
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Required trimmed title. Outer leading and trailing whitespace is removed and the stored title has no outer whitespace.
        description:
          type: string
          nullable: true
          maxLength: 2000
        priority:
          type: string
          enum: [Low, Medium, High]
        status:
          type: string
          enum: [Pending, Completed]
        dueDate:
          type: string
          nullable: true
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          x-real-gregorian-date: true
    Error:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - MALFORMED_REQUEST
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - ROUTE_NOT_FOUND
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, rule, message]
      properties:
        field:
          type: string
        rule:
          type: string
        message:
          type: string
x-unknown-route-response:
  httpStatus: 404
  errorCode: ROUTE_NOT_FOUND
  description: Unknown API routes return 404 with ROUTE_NOT_FOUND; unsupported methods on known routes return 405 with METHOD_NOT_ALLOWED.
